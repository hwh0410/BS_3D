<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BS 3D V0.6｜全廠配置</title><style>*{box-sizing:border-box}body{margin:0;background:#e9eff0;color:#17383d;font:14px system-ui,sans-serif}header{background:#153b43;color:white;padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}header a{color:white}main{display:flex;height:calc(100dvh - 64px)}#view{flex:1;position:relative;min-width:0}canvas{display:block}aside{width:320px;overflow:auto;background:white;padding:16px}button,input{font:inherit}button{border:1px solid #aabfc0;background:white;padding:7px 10px;border-radius:6px;cursor:pointer}#tools{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}.tag{position:absolute;background:#17383ddd;color:white;font-size:11px;padding:4px 6px;border-radius:4px;transform:translate(-50%,-100%);white-space:nowrap}label{display:block;padding:4px}h2{font-size:16px}p{line-height:1.6}#info,#status{white-space:pre-line;background:#edf5f3;padding:10px;border-radius:6px;line-height:1.6}.warning{color:#8b491b}#hint{position:absolute;bottom:12px;left:12px;background:#ffffffdf;padding:7px;border-radius:6px}@media(max-width:720px){main{flex-direction:column;height:calc(100dvh - 90px)}aside{width:100%;height:40%}#view{min-height:60%}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><header><b>BS 3D · V0.6</b><span>苗栗貨櫃式厭氧沼氣場｜全廠配置草案</span><a href="source-viewer.html">設備與原始模型</a><a href="legacy-v01.html">舊版配置</a></header><main><div id="view"><div id="tools"><button id="iso">全區視角</button><button id="top">俯視</button><button id="focus">貨櫃特寫</button><button id="flip">貨櫃端向反轉</button></div><div id="labels"></div><div id="hint">拖曳旋轉 · 滾輪縮放 · 點選設備</div></div><aside><div id="status">讀取工程配置…</div><h2>圖層</h2><div id="layers"></div><h2>設備資訊</h2><div id="info">點選場景物件。</div><h2>原始模型位置校核</h2><label>X 偏移 (m) <input id="dx" type="number" step=".1" value="0"></label><label>Z 偏移 (m) <input id="dz" type="number" step=".1" value="0"></label><label>Y 偏移 (m) <input id="dy" type="number" step=".1" value="0"></label><button id="reset">重設暫定對位</button><p>調整只在本次瀏覽有效，不修改原始模型。</p><h2>尚未校核</h2><p class="warning">粗黑界線與貨櫃外框相交，圖面可能存在不同圖層套疊。保留原圖關係，非地籍或施工判定。</p><p>地形等高線僅平面參考；未確認標高、道路寬度、槽體高度與設備定位，不填造數值。</p><a href="data/site-layout-v06.json">查看配置參數及來源說明</a></aside></main><script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const view=document.querySelector('#view'),status=document.querySelector('#status'),info=document.querySelector('#info'),scene=new T.Scene();scene.background=new T.Color(0xe4edf0);const camera=new T.PerspectiveCamera(45,1,.1,500),r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));view.prepend(r.domElement);const controls=new OrbitControls(camera,r.domElement);controls.enableDamping=true;scene.add(new T.HemisphereLight(0xffffff,0x84948c,2));const sun=new T.DirectionalLight(0xffffff,2.2);sun.position.set(-20,45,30);scene.add(sun);const tags=[],layers={},hits=[];let layout,assembly,shift,angle=0;function layer(id,title,visible=true){const g=new T.Group();g.visible=visible;scene.add(g);layers[id]=g;const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=visible;c.onchange=()=>g.visible=c.checked;l.append(c,' '+title);document.querySelector('#layers').append(l);return g}function mesh(g,geo,c,x=0,y=0,z=0){const m=new T.Mesh(geo,new T.MeshStandardMaterial({color:c,roughness:.83,side:T.DoubleSide}));m.position.set(x,y,z);g.add(m);return m}function box(g,x,y,z,w,h,d,c){return mesh(g,new T.BoxGeometry(w,h,d),c,x,y,z)}function tag(g,name,desc,h){g.userData={name,desc};hits.push(g);const e=document.createElement('div');e.className='tag';e.textContent=name;document.querySelector('#labels').append(e);tags.push({g,e,h})}function xy(p){const [a,b]=layout.frame.origin_px,k=layout.frame.pixels_per_m*Math.SQRT2;return [(p[0]-a-(p[1]-b))/k,(p[0]-a+p[1]-b)/k]}function line(g,ps,color,y=.04,closed=false){const v=ps.map(p=>{const [x,z]=xy(p);return new T.Vector3(x,y,z)});if(closed)v.push(v[0]);g.add(new T.Line(new T.BufferGeometry().setFromPoints(v),new T.LineBasicMaterial({color})))}
function roof(g,L,W,e,h){const v=new Float32Array([-L/2,e,-W/2,L/2,e,-W/2,L/2,h,0,-L/2,h,0,-L/2,e,W/2,L/2,e,W/2]);const geom=new T.BufferGeometry();geom.setAttribute('position',new T.BufferAttribute(v,3));geom.setIndex([0,1,2,0,2,3,3,2,5,3,5,4,0,3,4,1,5,2]);geom.computeVertexNormals();mesh(g,geom,0x933f37)}function build(g,b){const [x,z]=xy(b.center),a=new T.Group();g.add(a);a.position.set(x,0,z);box(a,0,b.eave/2,0,b.length,b.eave,b.width,0xe7dfce);roof(a,b.length+.25,b.width+.25,b.eave,b.ridge);for(let i=0;i<3;i++)box(a,-b.length*.32+i*b.length*.32,b.eave*.62,b.width/2+.04,1.1,.85,.08,0x4b6267);tag(a,b.name,'平立面圖：'+b.length+' × '+b.width+' m，簷高約 '+b.eave+' m、總高約 '+b.ridge+' m；門窗位置示意。',b.ridge+.2)}
function pose(p,t){camera.position.set(...p);controls.target.set(...t);controls.update()}document.querySelector('#iso').onclick=()=>pose([27,42,48],[-12,0,4]);document.querySelector('#top').onclick=()=>pose([-12,75,4.01],[-12,0,4]);document.querySelector('#focus').onclick=()=>pose([17,15,20],[0,1,0]);document.querySelector('#iso').click();
function position(){if(!shift||!assembly)return;const d=id=>Number(document.querySelector('#'+id).value)||0;shift.position.set(d('dx'),d('dy')+.04,d('dz'));shift.rotation.y=angle}for(const id of ['dx','dy','dz'])document.querySelector('#'+id).oninput=position;document.querySelector('#flip').onclick=()=>{angle=(angle+Math.PI)%(2*Math.PI);position()};document.querySelector('#reset').onclick=()=>{for(const id of ['dx','dy','dz'])document.querySelector('#'+id).value=0;angle=0;position()};
async function init(){const res=await fetch('data/site-layout-v06.json');if(!res.ok)throw Error('配置資料 '+res.status);layout=await res.json();const land=layer('land','基地平面'),bounds=layer('boundary','原圖粗黑界線'),cont=layer('contours','等高線參考（無高程）'),buildings=layer('buildings','辦公室／發電機房'),tanks=layer('tanks','儲水槽足跡（高度未確認）'),model=layer('model','原始貨櫃與共用設備'),unknown=layer('unknown','未分類原始幾何',false);box(land,-8,-.18,4,80,.3,74,0xa6b89b);const shape=new T.Shape();layout.boundary.forEach((p,i)=>{const [x,z]=xy(p);i?shape.lineTo(x,-z):shape.moveTo(x,-z)});shape.closePath();const floor=mesh(land,new T.ShapeGeometry(shape),0xd2d1c5,0,.01,0);floor.rotation.x=-Math.PI/2;line(bounds,layout.boundary,0x283d39,.07,true);layout.contours.forEach(p=>line(cont,p,0x718d74,.09));layout.buildings.forEach(b=>build(buildings,b));layout.tanks.forEach((p,i)=>{const [x,z]=xy(p),g=new T.Group();tanks.add(g);g.position.set(x,0,z);const disc=mesh(g,new T.CylinderGeometry(1.65,1.65,.1,32),0x718e9b,0,.08,0);tag(g,'儲水槽 '+(i+1),'圖面標示儲水槽；外圈約3.3 m（圖面估測），高度及正式設備編號未確認。',.3)});shift=new T.Group();model.add(shift);const {source_center_xz:c,source_base_y:y}=layout.reactor;const gltf=await new GLTFLoader().loadAsync('models/components/component_scene.glb');assembly=gltf.scene;assembly.position.set(-c[0],-y,-c[1]);shift.add(assembly);assembly.updateMatrixWorld(true);const list=[];assembly.traverse(o=>{if(o.isMesh)list.push(o)});const alias={reactor_candidate_1:'貨櫃 1',reactor_candidate_2:'貨櫃 2',reactor_candidate_3:'貨櫃 3',reactor_candidate_4:'貨櫃 4',excavator_candidate:'怪手候選',worker_candidate_1:'人員 1',worker_candidate_2:'人員 2',worker_candidate_3:'人員 3',shared_platform_piping_candidate:'共用平台及管線候選',unclassified:'未分類原始幾何'};for(const o of list){const key=alias[o.name]?o.name:o.parent?.name;if(!alias[key])continue;const b=new T.Box3().setFromObject(o),s=b.getSize(new T.Vector3());o.userData={name:alias[key],desc:'原始 STL 衍生候選元件；外廓 X/Y/Z '+s.toArray().map(v=>v.toFixed(3)).join(' × ')+' m。尚未校核正式編號及端向。'};hits.push(o);if(key==='unclassified'){o.visible=false;const checkbox=document.querySelector('#layers').lastChild.firstChild;checkbox.onchange=()=>{unknown.visible=checkbox.checked;o.visible=checkbox.checked}}}position();status.textContent='已載入 V0.4 原始幾何｜1:1 暫定公尺，貨櫃中心對位；未分類預設隱藏。'}
const ray=new T.Raycaster(),mouse=new T.Vector2();let down;r.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);r.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;const b=r.domElement.getBoundingClientRect();mouse.set((e.clientX-b.left)/b.width*2-1,1-(e.clientY-b.top)/b.height*2);ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(hits,true).find(h=>{let o=h.object;while(o){if(!o.visible)return false;o=o.parent}return true});if(h){let o=h.object;while(o&&!o.userData.name)o=o.parent;if(o)info.textContent=o.userData.name+'\n'+o.userData.desc}});
new ResizeObserver(()=>{r.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix()}).observe(view);r.setAnimationLoop(()=>{controls.update();r.render(scene,camera);for(const {g,e,h} of tags){const v=g.getWorldPosition(new T.Vector3());v.y+=h;v.project(camera);e.style.display=g.parent.visible&&Math.abs(v.x)<1&&Math.abs(v.y)<1&&Math.abs(v.z)<1?'block':'none';e.style.left=(v.x*.5+.5)*view.clientWidth+'px';e.style.top=(-v.y*.5+.5)*view.clientHeight+'px'}});init().catch(err=>status.textContent='載入未完成：'+err.message+'；可前往原始模型頁面檢視。');
</script></body></html>
