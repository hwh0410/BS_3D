async function init(){const res=await fetch('data/site-layout-v071.json');if(!res.ok)throw Error('配置資料 '+res.status);layout=await res.json();angle=(layout.reactor.rotation_y_deg??0)*Math.PI/180;const land=layer('land','基地平面'),bounds=layer('boundary','原圖粗黑界線'),cont=layer('contours','等高線參考（無高程）'),buildings=layer('buildings','辦公室／發電機房'),tanks=layer('tanks','儲水槽足跡（高度未確認）'),reserved=layer('reserved','未建模設備占位'),drains=layer('drains','排水溝參考'),model=layer('model','原始貨櫃與共用設備');box(land,-8,-.18,4,80,.3,74,0xa6b89b);const shape=new T.Shape();layout.boundary.forEach((p,i)=>{const [x,z]=xy(p);i?shape.lineTo(x,-z):shape.moveTo(x,-z)});shape.closePath();const floor=mesh(land,new T.ShapeGeometry(shape),0xd2d1c5,0,.01,0);floor.rotation.x=-Math.PI/2;line(bounds,layout.boundary,0x283d39,.07,true);layout.contours.forEach(p=>line(cont,p,0x718d74,.09));layout.buildings.forEach(b=>build(buildings,b));layout.tanks.forEach((p,i)=>{const [x,z]=xy(p),g=new T.Group();tanks.add(g);g.position.set(x,0,z);const disc=mesh(g,new T.CylinderGeometry(layout.tank_diameter/2,layout.tank_diameter/2,.1,32),0x718e9b,0,.08,0);tag(g,'儲水槽 '+(i+1),'圖面標示儲水槽；外圈約3.2 m（圖面估測），高度及正式設備編號未確認。',.3)});for(const p of layout.placeholders){const [x,z]=xy(p.center),g=new T.Group();reserved.add(g);g.position.set(x,.12,z);const geo=p.shape==='circle'?new T.CircleGeometry(p.diameter/2,32):new T.PlaneGeometry(p.length,p.width);const m=new T.Mesh(geo,new T.MeshBasicMaterial({color:0xd09a39,transparent:true,opacity:.55,side:T.DoubleSide,depthWrite:false}));m.rotation.x=-Math.PI/2;g.add(m);tag(g,(p.id?p.id+' ':'')+p.name,'未建模占位｜'+p.note,.25)}for(const d of layout.drains){line(drains,d.points,0x1888a1,.15);const mid=d.points[Math.floor(d.points.length/2)],[x,z]=xy(mid),g=new T.Group();drains.add(g);g.position.set(x,.15,z);tag(g,d.name,'排水溝線形參考；非施工定位。',.3)}shift=new T.Group();model.add(shift);const {source_center_xz:c,source_base_y:y}=layout.reactor;await loadModel();}
let loadGeneration=0;
const progressBar=document.querySelector('#loadingProgress'),retry=document.querySelector('#retry'),perf=document.querySelector('#perf');
function removeAssembly(){if(!assembly)return;const old=assembly;for(let i=hits.length-1;i>=0;i--){let o=hits[i];while(o&&o!==old)o=o.parent;if(o===old)hits.splice(i,1)}old.removeFromParent();disposeColor(old);assembly=null}
function registerPart(part){part.updateMatrixWorld(true);const name=part.userData.name;const size=new T.Box3().setFromObject(part).getSize(new T.Vector3());part.userData.desc+='｜外廓 X/Y/Z '+size.toArray().map(v=>v.toFixed(3)).join(' × ')+' m；正式設備編號待校核。';part.traverse(o=>{if(o.isMesh)hits.push(o)})}
async function loadModel(){if(!shift)return;const n=++loadGeneration;removeAssembly();retry.hidden=true;progressBar.value=0;status.textContent='正在載入原始彩色模型…';try{const g=await loadColor(T,GLTFLoader,(msg,stats)=>{if(n!==loadGeneration)return;status.textContent=msg;progressBar.value=stats.done;perf.textContent='已驗證 '+stats.triangles.toLocaleString()+' 面｜本機快取 '+(stats.cacheBytes/1e6).toFixed(1)+' MB'},()=>n===loadGeneration,(group,part,stats)=>{if(n!==loadGeneration)return;if(!part){assembly=group;const {source_center_xz:c,source_base_y:y}=layout.reactor;assembly.position.set(-c[0],-y,-c[1]);shift.add(assembly);position()}else registerPart(part)});if(n!==loadGeneration)return;status.textContent='原始彩色模型載入完成｜50 組｜4,621,182 三角面';perf.textContent='載入 '+g.stats.elapsed.toFixed(1)+' 秒｜快取 '+g.stats.cacheHits+'/50 組｜全部幾何已驗證'+'｜下載 '+(g.stats.wireBytes/1e6).toFixed(1)+' MB｜GZIP '+g.stats.gzipHits+'/50｜新增快取 '+g.stats.cacheWrites+' 組｜快取可用 '+(g.stats.cacheAvailable?'是':'否')+'｜各工作累計 網路 '+(g.stats.networkMs/1000).toFixed(1)+'s／解析 '+(g.stats.parseMs/1000).toFixed(1)+'s／快取 '+(g.stats.cacheMs/1000).toFixed(1)+'s'}catch(e){if(n===loadGeneration){removeAssembly();status.textContent='彩色模型載入失敗：'+e.message;retry.hidden=false}}}
retry.onclick=loadModel;
document.querySelector('#isolate').onchange=e=>{for(const [id,g] of Object.entries(layers)){if(id==='model')continue;g.visible=!e.target.checked;const i=Object.keys(layers).indexOf(id);document.querySelector('#layers').children[i].firstChild.checked=g.visible}};
const ray=new T.Raycaster(),mouse=new T.Vector2();let down;r.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);r.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;const b=r.domElement.getBoundingClientRect();mouse.set((e.clientX-b.left)/b.width*2-1,1-(e.clientY-b.top)/b.height*2);ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(hits,true).find(h=>{let o=h.object;while(o){if(!o.visible)return false;o=o.parent}return true});if(h){let o=h.object;while(o&&!o.userData.name)o=o.parent;if(o)info.textContent=o.userData.name+'\n'+o.userData.desc}});
new ResizeObserver(()=>{r.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix()}).observe(view);r.setAnimationLoop(()=>{controls.update();r.render(scene,camera);for(const {g,e,h} of tags){const v=g.getWorldPosition(new T.Vector3());v.y+=h;v.project(camera);e.style.display=g.parent.visible&&Math.abs(v.x)<1&&Math.abs(v.y)<1&&Math.abs(v.z)<1?'block':'none';e.style.left=(v.x*.5+.5)*view.clientWidth+'px';e.style.top=(-v.y*.5+.5)*view.clientHeight+'px'}});init().catch(err=>status.textContent='載入未完成：'+err.message+'；可前往原始模型頁面檢視。');
</script></body></html>
