*{box-sizing:border-box}body{margin:0;background:#e9eff0;color:#18343b;font:14px system-ui,sans-serif}header{height:64px;padding:12px 20px;background:#153b43;color:white;display:flex;align-items:center;gap:16px}header b{font-size:20px}header small{color:#b7d5d5}main{display:flex;height:calc(100dvh - 64px)}#view{flex:1;position:relative;min-width:0}canvas{display:block}aside{width:300px;overflow:auto;padding:18px;background:#fff;border-left:1px solid #cad8da}button,label{font:inherit}button{cursor:pointer;background:#fff;border:1px solid #b9c9cc;border-radius:7px;padding:8px 12px;color:#153b43}button:hover{background:#d7eeeb}#tools{position:absolute;top:12px;left:12px;display:flex;flex-wrap:wrap;gap:6px;z-index:2}#hint{position:absolute;bottom:12px;left:12px;background:#ffffffdf;padding:8px;border-radius:6px}h2{font-size:17px}p{line-height:1.65}label{display:block;padding:5px}#info{white-space:pre-line;line-height:1.7;background:#eef5f4;padding:12px;border-radius:8px}small{line-height:1.5}#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}.tag{position:absolute;background:#153b43e8;color:white;padding:3px 6px;border-radius:4px;white-space:nowrap;font-size:11px;transform:translate(-50%,-100%)}@media(max-width:700px){main{flex-direction:column}aside{width:100%;height:35%;border-left:0}#view{min-height:65%}header small{display:none}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><header><b>BS 3D</b><span>苗栗｜貨櫃式厭氧沼氣場</span><small>V0.1 · 配置示意 / 非施工圖</small></header><main><div id="view"><div id="tools"><button id="iso">全區視角</button><button id="top">俯視</button><button id="focus">醱酵槽</button><button id="roof">切換槽頂</button></div><div id="labels"></div><div id="hint">拖曳旋轉 · 滾輪縮放 · 右鍵平移 · 點選設備</div></div><aside><h2>模型圖層</h2><div id="layers"></div><h2>設備資訊</h2><div id="info">點選模型查看設備資訊。位置為圖面初步對位，未經工程校核。</div><h2>匯入原始模型</h2><input id="upload" type="file" accept=".glb"><p><small>可在本機載入已轉換的 GLB，替換貨櫃示意模型。檔案不會上傳。匯入模型須以公尺、Y 向上、中心原點製作；若是單槽模型請先組合四槽。</small></p><button id="restore">恢復示意貨櫃</button><h2>資料與限制</h2><p>配置依全區圖第 1 頁相對位置；建築依平立面圖；設備尺寸依採購表。四槽以使用者指定為準。地形、屋高、管線與未定位設備未作施工級校核。</p><small>座標為廠區局部座標，非地籍座標。原始工程文件未公開上傳。</small></aside></main><script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const view=document.querySelector('#view'),scene=new T.Scene();scene.background=new T.Color(0xe4edf0);const camera=new T.PerspectiveCamera(45,1,.1,500);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;view.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2-.03;scene.add(new T.HemisphereLight(0xffffff,0x70856f,2.1));const sun=new T.DirectionalLight(0xffffff,2.5);sun.position.set(-25,50,30);sun.castShadow=true;Object.assign(sun.shadow.camera,{left:-55,right:55,top:55,bottom:-55,far:150});sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const groups={},hits=[],tags=[],roofs=[];const layers=document.querySelector('#layers');function layer(id,title){const g=new T.Group();scene.add(g);groups[id]=g;const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=true;c.onchange=()=>g.visible=c.checked;l.append(c,' '+title);layers.append(l);return g}const land=layer('land','基地與道路'),build=layer('build','建築'),dig=layer('dig','四座貨櫃醱酵槽'),equip=layer('equip','槽體及設備'),flow=layer('flow','概念管線（非施工配管）');flow.visible=false;layers.lastChild.firstChild.checked=false;
const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.77});function mesh(g,geo,c,x,y,z){const m=new T.Mesh(geo,mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}function box(g,x,y,z,a,b,c,color){return mesh(g,new T.BoxGeometry(a,b,c),color,x,y,z)}function cyl(g,x,y,z,r,h,color){return mesh(g,new T.CylinderGeometry(r,r,h,32),color,x,y,z)}function item(parent,name,desc,x,y,z){const g=new T.Group();parent.add(g);g.position.set(x,y,z);g.userData={name,desc};hits.push(g);const el=document.createElement('div');el.className='tag';el.textContent=name;document.querySelector('#labels').append(el);tags.push({g,el});return g}
const ground=box(land,-10,-.22,2,85,.35,65,0x91a98b);const grid=new T.GridHelper(80,80,0x79938a,0x9eb4a6);grid.position.set(-10,-.035,2);land.add(grid);
// Polygon traced approximately from plan image in local metres. x NE, z SE.
const P=[[24,441],[192,337],[370,356],[497,410],[586,565],[483,655],[289,685],[135,584]];function xy(p){return [(p[0]-398-(p[1]-394))/11.3,(p[0]-398+p[1]-394)/11.3]}const shape=new T.Shape();P.map(xy).forEach(([x,z],i)=>i?shape.lineTo(x,-z):shape.moveTo(x,-z));shape.closePath();const pad=mesh(land,new T.ShapeGeometry(shape),0xc8c7bb,0,.01,0);pad.rotation.x=-Math.PI/2;const edge=P.map(p=>{const [x,z]=xy(p);return new T.Vector3(x,.06,z)});edge.push(edge[0]);land.add(new T.Line(new T.BufferGeometry().setFromPoints(edge),new T.LineBasicMaterial({color:0x4a645b})));
function building(name,x,z,w,d,h){const g=item(build,name,'平立面圖：平面尺寸約 '+w+' × '+d+' m；高度暫估，門窗與屋頂為示意。',x,0,z);box(g,0,h/2,0,w,h,d,0xe9e3d5);const roof=box(g,0,h+.15,0,w+.4,.3,d+.4,0x933b32);for(let i=0;i<3;i++)box(g,-w*.3+i*w*.3,h*.6,d/2+.03,1.1,.9,.08,0x42616a);box(g,0,1.3,d/2+.06,2.2,2.6,.1,0x54696c);return g}building('大型建築',-26,-2.5,12.15,12,5);building('長形建築',-25,-15,12,5,4);
for(let i=0;i<4;i++){const g=item(dig,'醱酵槽 '+(i+1),'40 呎貨櫃；外廓暫採 12.192 × 2.438 × 2.591 m。四槽相鄰；非原始 EASM 網格。',0,0,(i-1.5)*2.55);box(g,0,.13,0,12.19,.26,2.44,0x303b3d);for(const side of [-1,1]){box(g,0,1.42,side*1.18,12.19,2.32,.09,0xa34b3b);for(let j=0;j<37;j++)box(g,-5.96+j*.33,1.42,side*1.24,.07,2.25,.09,0x743c34)}box(g,-6.05,1.42,0,.12,2.32,2.44,0x8b4338);box(g,6.05,1.42,0,.12,2.32,2.44,0x8b4338);for(const z of [-.58,.58])box(g,6.13,1.42,z,.06,2.3,.055,0xadb5b2);const r=box(g,0,2.59,0,12.19,.12,2.44,0xa34b3b);roofs.push(r);for(const z of [-1.14,1.14])for(const x of [-6,6])box(g,x,1.42,z,.16,2.6,.16,0x303b3d);}
const tankPos=[[-13.5,-4.7],[-13.6,0.4],[-13.9,5.1]];tankPos.forEach(([x,z],i)=>{const name=i<2?'沼液槽 '+(i?'B':'A'):'第三圓形設備（待確認）';const g=item(equip,name,i<2?'D-1004A/B；採購表：PE 50T，高 7456 mm，直徑 3100 mm。圖面對應位置待校核。':'圖面有第三圓形輪廓；設備身分及高度待確認。',x,0,z);const h=i<2?7.456:3;box(g,0,.09,0,3.6,.18,3.6,0x777e7e);cyl(g,0,h/2+.18,0,1.55,h,i<2?0x475d50:0x9b9c8b);cyl(g,0,h+.2,0,1.57,.1,0x697d69)});
function pipe(g,a,b,r,color){const v=new T.Vector3(...b).sub(new T.Vector3(...a)),m=mesh(g,new T.CylinderGeometry(r,r,v.length(),10),color,...a);m.position.addScaledVector(v,.5);m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v.normalize());return m}
for(let i=0;i<4;i++){let z=(i-1.5)*2.55;pipe(flow,[6,2.7,z],[8,2.7,z],.075,0xe6b349)}pipe(flow,[8,2.7,-3.825],[8,2.7,3.825],.1,0xe6b349);
const list=[['儲氣袋 BD-1001','2 只；直徑 2.5 m、長 10 m；位置待定'],['火炬 Z-1001','燃燒頭約 2.2 m；立柱約 2 m；安裝位置待定'],['冷卻水塔 Z-1004','LBC-25RT；211 LPM；位置待定'],['沼液井 D-1003','PE 1.5T；高 1.69 m、直徑 1.23 m'],['沼液噴淋泵 G-1004A/B','6 m³/h、揚程 40 m'],['沼液循環泵 G-1006A/B','18 m³/h、揚程 21 m'],['沼液加熱器 E-1003','BEM 殼管式；350 × 800 mm']];const catalog=document.createElement('div');catalog.innerHTML='<h2>未定位設備清單</h2>';list.forEach(([n,d])=>{const p=document.createElement('p');p.textContent=n+'｜'+d;catalog.append(p)});document.querySelector('aside').append(catalog);
function setView(p,t){camera.position.set(...p);controls.target.set(...t);controls.update()}document.querySelector('#iso').onclick=()=>setView([35,42,52],[-10,0,0]);document.querySelector('#top').onclick=()=>setView([-10,65,.01],[-10,0,0]);document.querySelector('#focus').onclick=()=>setView([18,15,20],[0,1,0]);document.querySelector('#iso').click();let roofOn=true;document.querySelector('#roof').onclick=()=>{roofOn=!roofOn;roofs.forEach(r=>r.visible=roofOn)};const ray=new T.Raycaster(),mouse=new T.Vector2();let down;renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(hits.filter(g=>g.parent.visible),true).find(h=>h.object.visible);if(hit){let g=hit.object;while(g&&!g.userData.name)g=g.parent;if(g)document.querySelector('#info').textContent=g.userData.name+'\n'+g.userData.desc}});
let imported=null;document.querySelector('#upload').onchange=async e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);try{const gltf=await new GLTFLoader().loadAsync(url);if(imported)scene.remove(imported);imported=gltf.scene;scene.add(imported);dig.visible=false;document.querySelector('#info').textContent='已載入本機 GLB；尺寸與原點需人工校核。'}catch(err){document.querySelector('#info').textContent='GLB 讀取失敗：'+err.message}finally{URL.revokeObjectURL(url)}};document.querySelector('#restore').onclick=()=>{if(imported)scene.remove(imported);imported=null;dig.visible=true;layers.children[2].firstChild.checked=true};
new ResizeObserver(()=>{renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix()}).observe(view);renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);for(const {g,el} of tags){const v=g.getWorldPosition(new T.Vector3());v.y+=g.parent===equip?8:g.parent===build?5.5:3;v.project(camera);el.style.display=g.parent.visible&&Math.abs(v.x)<1&&Math.abs(v.y)<1&&Math.abs(v.z)<1?'block':'none';el.style.left=(v.x*.5+.5)*view.clientWidth+'px';el.style.top=(-v.y*.5+.5)*view.clientHeight+'px'}});
