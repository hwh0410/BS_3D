name: Build complete original geometry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_full_geometry.py'
      - '.github/workflows/build-full-geometry.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: bs-full-geometry
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download unchanged original release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1-source --pattern '*.stl' --output /tmp/BS_original.stl
      - name: Build and verify every triangle
        run: |
          python -m pip install numpy==2.2.6
          python scripts/build_full_geometry.py /tmp/BS_original.stl models/full/complete.glb
      - uses: actions/upload-artifact@v4
        with:
          name: BS-complete-geometry
          path: models/full/
      - name: Commit verified complete geometry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/full/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish lossless original geometry GLB'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Request branch-based Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
        continue-on-error: true
