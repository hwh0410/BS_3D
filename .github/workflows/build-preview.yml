name: Build source model preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/group_preview.py'
      - 'scripts/extract_components.py'
      - '.github/workflows/build-preview.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download unchanged release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1-source --pattern '*.stl' --output /tmp/BS_original.stl
      - name: Convert verified STL
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 trimesh==4.7.4
          python scripts/build_preview.py /tmp/BS_original.stl models/optimized/full_scene.glb
          python scripts/group_preview.py models/optimized/full_scene.glb models/optimized/grouped_scene.glb
          python scripts/extract_components.py /tmp/BS_original.stl models/components
      - uses: actions/upload-artifact@v4
        with:
          name: BS-optimized-preview
          path: |
            models/optimized/
            models/components/
      - name: Commit preview only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/optimized/ models/components/
          if ! git diff --cached --quiet; then
            git commit -m 'Build verified original STL preview'
            git push origin HEAD:main
          fi
