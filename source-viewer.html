<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BS 3D | 原始幾何預覽</title><style>body{margin:0;font:14px system-ui;color:#234047;background:#e7eef0}header{padding:14px;background:#153b43;color:white;display:flex;gap:12px;align-items:center;flex-wrap:wrap}a{color:inherit}button,input{font:inherit}button{padding:7px;border:1px solid #a7bdc0;border-radius:6px;background:white;cursor:pointer}#groups{display:flex;flex-wrap:wrap;gap:8px;padding:8px;background:white}#groups label{white-space:nowrap}#view{height:calc(100dvh - 310px);min-height:300px}#status{padding:10px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><header><b>BS 3D · V0.6.2 原始幾何預覽</b><a href="index.html">全廠配置</a><button id="iso">斜視</button><button id="top">俯視</button><button id="side">側視</button><button id="wire">線框</button><button id="full">完整工程模式</button><button id="light">輕量展示模式</button><input type="file" id="local" accept=".glb,.stl"></header><div id="status">載入完整工程 GLB…</div><div id="groups"></div><section id="equipmentPanel" style="padding:10px;background:white"><b>設備規格與模型對應</b> <input id="searchEquipment" placeholder="搜尋名稱或設備編號"><select id="equipmentSelect"><option>載入中</option></select><div id="equipmentInfo" style="white-space:pre-wrap;padding-top:8px">點選模型或搜尋設備；未定位設備僅顯示規格。</div></section><div id="view"></div><script type="module">import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {STLLoader} from 'three/addons/loaders/STLLoader.js';const view=document.querySelector('#view'),status=document.querySelector('#status'),scene=new T.Scene();scene.background=new T.Color(0xe7eef0);const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));view.append(r.domElement);const camera=new T.PerspectiveCamera(45,1,.01,2000),controls=new OrbitControls(camera,r.domElement);controls.enableDamping=true;scene.add(new T.HemisphereLight(0xffffff,0x647d80,2));const light=new T.DirectionalLight(0xffffff,2.5);light.position.set(10,20,12);scene.add(light);let model,center=new T.Vector3(),span=40,wire=false;function pose(v){camera.position.copy(center).addScaledVector(new T.Vector3(...v).normalize(),span*1.8);controls.target.copy(center);controls.update()}const names={reactor_candidate_1:'貨櫃候選 1',reactor_candidate_2:'貨櫃候選 2',reactor_candidate_3:'貨櫃候選 3',reactor_candidate_4:'貨櫃候選 4',worker_candidate_1:'人員候選 1',worker_candidate_2:'人員候選 2',worker_candidate_3:'人員候選 3',shared_platform_piping_candidate:'共用平台及管線候選',reactor_zone_1:'貨櫃區 1',reactor_zone_2:'貨櫃區 2',reactor_zone_3:'貨櫃區 3',reactor_zone_4:'貨櫃區 4',service_zone:'操作設備區',excavator_candidate:'怪手候選區',west_equipment_zone:'西側設備區',ground_candidate:'地坪候選區',unclassified:'未分類'};function show(g,label){if(model){scene.remove(model);model.traverse(o=>{if(o.isMesh){o.geometry.dispose();o.material.dispose()}})}model=g;model.traverse(o=>{if(o.isMesh){const old=o.material;const color=old?.color?.clone()??new T.Color(0x749397);o.material=new T.MeshStandardMaterial({color,roughness:.8,side:T.DoubleSide,flatShading:true,wireframe:wire});old?.dispose?.()}});scene.add(model);const panel=document.querySelector('#groups');panel.replaceChildren();model.traverse(o=>{if(!o.isMesh)return;const key=names[o.name]?o.name:o.parent?.name; if(!names[key])return;const label=document.createElement('label'),cb=document.createElement('input'),color=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.onchange=()=>o.visible=cb.checked;color.type='color';color.value='#'+o.material.color.getHexString();color.oninput=()=>o.material.color.set(color.value);label.append(cb,names[key],color);panel.append(label)});const b=new T.Box3().setFromObject(g),s=b.getSize(new T.Vector3());b.getCenter(center);span=Math.max(s.x,s.y,s.z,1);pose([1,.8,1]);status.textContent=label+' ｜外廓 '+[s.x,s.y,s.z].map(n=>n.toFixed(3)).join(' × ')+'（來源座標；暫視為公尺）｜Y 向上暫定、分區及色彩為暫定，非 CAD 原始組件或材質；尚未與全區配置校準。'}document.querySelector('#iso').onclick=()=>pose([1,.8,1]);document.querySelector('#top').onclick=()=>pose([0,1,.0001]);document.querySelector('#side').onclick=()=>pose([1,0,0]);document.querySelector('#wire').onclick=()=>{wire=!wire;model?.traverse(o=>{if(o.isMesh)o.material.wireframe=wire})};let generation=0;const eqPanel=document.querySelector('#equipmentInfo'),eqSelect=document.querySelector('#equipmentSelect'),search=document.querySelector('#searchEquipment');let eq=[];function describe(e){if(!e)return;eqPanel.textContent=e.id+' ｜ '+e.name+'\n'+e.spec+'\n來源：'+e.source.sheet+' 第 '+e.source.row+' 列；未建立正式定位者不可視為已對應模型。'}function options(){const q=search.value.toLowerCase();eqSelect.replaceChildren(new Option('選擇設備',''));for(const e of eq.filter(e=>(e.id+' '+e.name+' '+e.category).toLowerCase().includes(q)))eqSelect.add(new Option(e.id+' '+e.name,e.id))}search.oninput=options;eqSelect.onchange=()=>describe(eq.find(e=>e.id===eqSelect.value));fetch('data/equipment.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{eq=d.equipment;options()}).catch(()=>{eqPanel.textContent='設備資料庫載入失敗';eqSelect.replaceChildren(new Option('未載入',''))});const ray=new T.Raycaster(),pointer=new T.Vector2();let start;const canvas=r.domElement;canvas.addEventListener('pointerdown',e=>start=[e.clientX,e.clientY]);canvas.addEventListener('pointerup',e=>{if(!model||!start||Math.hypot(e.clientX-start[0],e.clientY-start[1])>5)return;const b=canvas.getBoundingClientRect();pointer.set(2*(e.clientX-b.left)/b.width-1,1-2*(e.clientY-b.top)/b.height);ray.setFromCamera(pointer,camera);const pickables=[];model.traverse(o=>{if(o.isMesh&&(o.geometry.index?.count??o.geometry.attributes.position.count)<1500000)pickables.push(o)});const hit=ray.intersectObjects(pickables,false).find(h=>{let o=h.object;while(o){if(!o.visible)return false;o=o.parent}return true});if(!hit)return;let o=hit.object;while(o&&!names[o.name])o=o.parent;if(!o){eqPanel.textContent='未分類模型；尚無設備對應';return}const size=new T.Box3().setFromObject(o).getSize(new T.Vector3());const dim='\n模型外廓 X/Y/Z：'+size.toArray().map(n=>n.toFixed(3)).join(' × ')+' m（暫定單位）';if(/^reactor_(candidate|zone)_/.test(o.name)){const e=eq.find(e=>e.id==='R-1001A/B/C');if(e){describe(e);eqPanel.textContent+='\n'+names[o.name]+dim+'\n四槽正式編號尚未確認。';eqSelect.value=e.id;return}}eqPanel.textContent=names[o.name]+dim+'\n尚未建立正式設備編號對應。';});document.querySelector('#local').onchange=async e=>{const f=e.target.files[0];if(!f)return;const n=++generation;status.textContent='讀取本機檔案…';const url=URL.createObjectURL(f);try{const g=f.name.toLowerCase().endsWith('.stl')?new T.Mesh(await new STLLoader().loadAsync(url)): (await new GLTFLoader().loadAsync(url)).scene;if(n===generation)show(g,f.name)}catch(err){if(n===generation)status.textContent='讀取失敗：'+err.message}finally{URL.revokeObjectURL(url)}};new ResizeObserver(()=>{r.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix()}).observe(view);r.setAnimationLoop(()=>{controls.update();r.render(scene,camera)});async function loadMode(mode){const n=++generation;status.textContent=mode==='full'?'載入完整工程模型…':'載入輕量展示模型…';try{const g=await (mode==='full'?new GLTFLoader().loadAsync('models/full/complete.glb').catch(()=>{status.textContent='Pages 模型尚未同步，改從 GitHub 原始檔案載入完整幾何…';return new GLTFLoader().loadAsync('https://raw.githubusercontent.com/hwh0410/BS_3D/main/models/full/complete.glb')}):new GLTFLoader().loadAsync('models/components/component_scene.glb'));if(n!==generation)return;let count=0;g.scene.traverse(o=>{if(o.isMesh)count+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3});if(mode==='full'&&count!==4621182)throw Error('完整面數校驗失敗');show(g.scene,(mode==='full'?'完整工程模型':'輕量展示模型')+'｜'+count.toLocaleString()+' 三角面');}catch(e){if(n===generation)status.textContent='載入未完成：'+e.message+'；可選擇本機 STL/GLB 或輕量模式。'}}document.querySelector('#full').onclick=()=>loadMode('full');document.querySelector('#light').onclick=()=>loadMode('light');loadMode('full');</script></body></html>
