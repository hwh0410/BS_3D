<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BS 3D | 原始幾何預覽</title><style>body{margin:0;font:14px system-ui;color:#234047;background:#e7eef0}header{padding:14px;background:#153b43;color:white;display:flex;gap:12px;align-items:center;flex-wrap:wrap}a{color:inherit}button,input{font:inherit}button{padding:7px;border:1px solid #a7bdc0;border-radius:6px;background:white;cursor:pointer}#view{height:calc(100dvh - 150px);min-height:300px}#status{padding:10px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><header><b>BS 3D · V0.2 原始幾何預覽</b><a href="index.html">全廠配置</a><button id="iso">斜視</button><button id="top">俯視</button><button id="side">側視</button><button id="wire">線框</button><input type="file" id="local" accept=".glb,.stl"></header><div id="status">載入優化 GLB…</div><div id="view"></div><script type="module">import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {STLLoader} from 'three/addons/loaders/STLLoader.js';const view=document.querySelector('#view'),status=document.querySelector('#status'),scene=new T.Scene();scene.background=new T.Color(0xe7eef0);const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));view.append(r.domElement);const camera=new T.PerspectiveCamera(45,1,.01,2000),controls=new OrbitControls(camera,r.domElement);controls.enableDamping=true;scene.add(new T.HemisphereLight(0xffffff,0x647d80,2));const light=new T.DirectionalLight(0xffffff,2.5);light.position.set(10,20,12);scene.add(light);let model,center=new T.Vector3(),span=40,wire=false;function pose(v){camera.position.copy(center).addScaledVector(new T.Vector3(...v).normalize(),span*1.8);controls.target.copy(center);controls.update()}function show(g,label){if(model){scene.remove(model);model.traverse(o=>{if(o.isMesh){o.geometry.dispose();o.material.dispose()}})}model=g;model.traverse(o=>{if(o.isMesh){o.material=new T.MeshStandardMaterial({color:0x749397,roughness:.8,side:T.DoubleSide,wireframe:wire})}});scene.add(model);const b=new T.Box3().setFromObject(g),s=b.getSize(new T.Vector3());b.getCenter(center);span=Math.max(s.x,s.y,s.z,1);pose([1,.8,1]);status.textContent=label+' ｜外廓 '+[s.x,s.y,s.z].map(n=>n.toFixed(3)).join(' × ')+'（來源座標；暫視為公尺）｜Y 向上暫定、原始材質未保留、尚未與全區配置校準。'}document.querySelector('#iso').onclick=()=>pose([1,.8,1]);document.querySelector('#top').onclick=()=>pose([0,1,.0001]);document.querySelector('#side').onclick=()=>pose([1,0,0]);document.querySelector('#wire').onclick=()=>{wire=!wire;model?.traverse(o=>{if(o.isMesh)o.material.wireframe=wire})};let generation=0;document.querySelector('#local').onchange=async e=>{const f=e.target.files[0];if(!f)return;const n=++generation;status.textContent='讀取本機檔案…';const url=URL.createObjectURL(f);try{const g=f.name.toLowerCase().endsWith('.stl')?new T.Mesh(await new STLLoader().loadAsync(url)): (await new GLTFLoader().loadAsync(url)).scene;if(n===generation)show(g,f.name)}catch(err){if(n===generation)status.textContent='讀取失敗：'+err.message}finally{URL.revokeObjectURL(url)}};new ResizeObserver(()=>{r.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix()}).observe(view);r.setAnimationLoop(()=>{controls.update();r.render(scene,camera)});new GLTFLoader().loadAsync('models/optimized/full_scene.glb').then(g=>{if(!generation)show(g.scene,'優化 GLB')}).catch(()=>{if(!generation)status.textContent='尚未部署 GLB；請以本機選檔載入優化 GLB 或原始 STL。原始 STL 約 231 MB，建議桌面使用。'});</script></body></html>
