<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BS 3D | 原始幾何預覽</title><style>body{margin:0;font:14px system-ui;color:#234047;background:#e7eef0}header{padding:14px;background:#153b43;color:white;display:flex;gap:12px;align-items:center;flex-wrap:wrap}a{color:inherit}button,input{font:inherit}button{padding:7px;border:1px solid #a7bdc0;border-radius:6px;background:white;cursor:pointer}#groups{display:flex;flex-wrap:wrap;gap:8px;padding:8px;background:white}#groups label{white-space:nowrap}#view{height:calc(100dvh - 310px);min-height:300px}#status{padding:10px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><header><b>BS 3D · V0.6.4 原始幾何預覽</b><a href="index.html">全廠配置</a><button id="iso">斜視</button><button id="top">俯視</button><button id="side">側視</button><button id="wire">線框</button><button id="retry" hidden>重新載入</button></header><div id="status">載入原始彩色模型…</div><progress id="loadingProgress" max="50" value="0" style="width:100%"></progress><div id="groups"></div><section id="equipmentPanel" style="padding:10px;background:white"><b>設備規格與模型對應</b> <input id="searchEquipment" placeholder="搜尋名稱或設備編號"><select id="equipmentSelect"><option>載入中</option></select><div id="equipmentInfo" style="white-space:pre-wrap;padding-top:8px">點選模型或搜尋設備；未定位設備僅顯示規格。</div></section><div id="view"></div><script type="module">import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {loadColor,disposeColor} from './src/load-color-v064.js';const view=document.querySelector('#view'),status=document.querySelector('#status'),scene=new T.Scene();scene.background=new T.Color(0xe7eef0);const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));view.append(r.domElement);const camera=new T.PerspectiveCamera(45,1,.01,2000),controls=new OrbitControls(camera,r.domElement);controls.enableDamping=true;scene.add(new T.HemisphereLight(0xffffff,0x647d80,2));const light=new T.DirectionalLight(0xffffff,2.5);light.position.set(10,20,12);scene.add(light);let model,center=new T.Vector3(),span=40,wire=false;function pose(v){camera.position.copy(center).addScaledVector(new T.Vector3(...v).normalize(),span*1.8);controls.target.copy(center);controls.update()}function addPart(part){const panel=document.querySelector('#groups');const label=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.onchange=()=>part.visible=cb.checked;label.append(cb,part.name);panel.append(label);part.traverse(o=>{if(o.isMesh)for(const m of [].concat(o.material))m.wireframe=wire})}
document.querySelector('#iso').onclick=()=>pose([1,.8,1]);document.querySelector('#top').onclick=()=>pose([0,1,.0001]);document.querySelector('#side').onclick=()=>pose([1,0,0]);document.querySelector('#wire').onclick=()=>{wire=!wire;model?.traverse(o=>{if(o.isMesh)[].concat(o.material).forEach(m=>m.wireframe=wire)})};let generation=0;const eqPanel=document.querySelector('#equipmentInfo'),eqSelect=document.querySelector('#equipmentSelect'),search=document.querySelector('#searchEquipment');let eq=[];function describe(e){if(!e)return;eqPanel.textContent=e.id+' ｜ '+e.name+'\n'+e.spec+'\n來源：'+e.source.sheet+' 第 '+e.source.row+' 列；未建立正式定位者不可視為已對應模型。'}function options(){const q=search.value.toLowerCase();eqSelect.replaceChildren(new Option('選擇設備',''));for(const e of eq.filter(e=>(e.id+' '+e.name+' '+e.category).toLowerCase().includes(q)))eqSelect.add(new Option(e.id+' '+e.name,e.id))}search.oninput=options;eqSelect.onchange=()=>describe(eq.find(e=>e.id===eqSelect.value));fetch('data/equipment.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{eq=d.equipment;options()}).catch(()=>{eqPanel.textContent='設備資料庫載入失敗';eqSelect.replaceChildren(new Option('未載入',''))});const ray=new T.Raycaster(),pointer=new T.Vector2();let start;const canvas=r.domElement;canvas.addEventListener('pointerdown',e=>start=[e.clientX,e.clientY]);canvas.addEventListener('pointerup',e=>{if(!model||!start||Math.hypot(e.clientX-start[0],e.clientY-start[1])>5)return;const b=canvas.getBoundingClientRect();pointer.set(2*(e.clientX-b.left)/b.width-1,1-2*(e.clientY-b.top)/b.height);ray.setFromCamera(pointer,camera);const pickables=[];model.traverse(o=>{if(o.isMesh&&(o.geometry.index?.count??o.geometry.attributes.position.count)<1500000)pickables.push(o)});const hit=ray.intersectObjects(pickables,false).find(h=>{let o=h.object;while(o){if(!o.visible)return false;o=o.parent}return true});if(!hit)return;let o=hit.object;while(o&&!o.userData?.name)o=o.parent;if(!o){eqPanel.textContent='未分類模型；尚無設備對應';return}const size=new T.Box3().setFromObject(o).getSize(new T.Vector3());const dim='\n模型外廓 X/Y/Z：'+size.toArray().map(n=>n.toFixed(3)).join(' × ')+' m（暫定單位）';if(/發酵貨櫃/.test(o.name)){const e=eq.find(e=>e.id==='R-1001A/B/C');if(e){describe(e);eqPanel.textContent+='\n'+o.userData.name+dim+'\n四槽正式編號尚未確認。';eqSelect.value=e.id;return}}eqPanel.textContent=o.userData.name+dim+'\n尚未建立正式設備編號對應。';});new ResizeObserver(()=>{r.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix()}).observe(view);r.setAnimationLoop(()=>{controls.update();r.render(scene,camera)});const progressBar=document.querySelector('#loadingProgress'),retry=document.querySelector('#retry');async function loadModel(){const n=++generation;retry.hidden=true;progressBar.value=0;document.querySelector('#groups').replaceChildren();if(model){model.removeFromParent();disposeColor(model);model=null}center.set(-12.2428093,-7.971279,32.9);span=32;pose([1,.8,1]);try{const g=await loadColor(T,GLTFLoader,(msg,stats)=>{if(n===generation){status.textContent=msg;progressBar.value=stats.done}},()=>n===generation,(group,part)=>{if(n!==generation)return;if(!part){model=group;scene.add(model)}else addPart(part)});if(n===generation)status.textContent='原始彩色完整模型｜50 組｜4,621,182 三角面｜'+g.stats.elapsed.toFixed(1)+' 秒｜快取 '+g.stats.cacheHits+'/50 組'}catch(e){if(n===generation){model=null;document.querySelector('#groups').replaceChildren();status.textContent='載入失敗：'+e.message;retry.hidden=false}}}retry.onclick=loadModel;loadModel();</script></body></html>
